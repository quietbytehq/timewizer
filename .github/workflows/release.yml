name: Release

# Builds the installers for Linux (.deb, AppImage) and Windows (.exe, .msi).
# Run it by hand (Actions tab) to just get the files, or push a tag like v0.1.0
# to also create a DRAFT release with every installer attached.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  linux:
    # An older Ubuntu keeps the AppImage working on more computers.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf xdg-utils
      - run: npm ci
      - run: npm run release
      - uses: actions/upload-artifact@v6
        with:
          name: timewizer-linux
          path: release/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      # Also run the Rust tests on Windows, so Windows-only problems show up before release.
      - name: Rust tests
        continue-on-error: true
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run release
      - uses: actions/upload-artifact@v6
        with:
          name: timewizer-windows
          path: release/*

  publish:
    # Only when a tag was pushed: gather both sets of installers into a draft release.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true
      - run: ls -l release
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          draft: true
